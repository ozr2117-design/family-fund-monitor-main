name: Fund Sentinel (Daily Check)

on:
  # ✅ 已停用 GitHub 原生 cron（延迟 15~60 分钟，已改用 cron-job.org 精准触发）
  # schedule:
  #   - cron: '47 6 * * 1-5' # 06:47 UTC = 14:47 Beijing (Signal Check)
  #   - cron: '17 7 * * 1-5' # 07:17 UTC = 15:17 Beijing (Daily Report)
  workflow_dispatch:  # 由 cron-job.org 精准触发

# 🔥 核心变化1：赋予写入仓库的权限
permissions:
  contents: write

jobs:
  check_and_push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Run Sentinel Script
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_check.py
        
      # 🔥 核心变化2：如果日记文件被修改了，把它提交回仓库
      - name: Commit and Push Log
        run: |
          git config --global user.name "FundBot"
          git config --global user.email "bot@github.com"
          git add signals.md report_status.json history.json
          # 只有当文件有变化时才提交，否则不报错
          git commit -m "📝 Update signal log, status & history snapshot" || echo "No changes to commit"
          git push
