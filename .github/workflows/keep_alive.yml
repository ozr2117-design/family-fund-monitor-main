name: Prevent Streamlit Sleep (Keep Alive)

on:
  workflow_dispatch:  # 由 cron-job.org 精准调度触发

permissions:
  contents: read

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Wakeup Script
        run: python wake_streamlit.py "https://family-fund-monitor-1.streamlit.app/"
